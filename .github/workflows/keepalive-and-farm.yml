name: VPS Keep-Alive Pinger & Autonomous SEO Farm

on:
  schedule:
    # Pings VPS every 25 minutes to prevent 30-minute idle auto-pause when active
    - cron: "*/25 * * * *"
  workflow_dispatch:
    inputs:
      farm_topic:
        description: "Opsional: Topik riset baru untuk di-farm ke 13 domain"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  keepalive-and-farm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Ping InstaBox VPS Keep-Alive Endpoint (Prevent 30-Min Idle Sleep)
        env:
          VPS_KEEPALIVE_URL: ${{ secrets.VPS_KEEPALIVE_URL }}
        run: |
          if [ -n "$VPS_KEEPALIVE_URL" ]; then
            echo "Pinging InstaBox Workhorse at $VPS_KEEPALIVE_URL..."
            curl -fsSL --max-time 10 "$VPS_KEEPALIVE_URL" || echo "VPS currently sleeping or unreachable."
          else
            echo "Info: Set secret VPS_KEEPALIVE_URL (e.g. http://<IP_VPS>:8080/keepalive) to enable 24/7 auto-wake."
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Initialize & Verify AI Workhorse Engine
        run: |
          python vps_engine/empire_workhorse.py --init-only
          python build_monorepo.py
          python test_monorepo.py
